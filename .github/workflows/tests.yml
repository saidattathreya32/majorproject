name: tests
on: [push, pull_request]
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install numpy opencv-python-headless fastapi "uvicorn[standard]" pytest httpx pyflakes
      - run: python -m pyflakes lipvision scripts tests
      - run: pytest -q
